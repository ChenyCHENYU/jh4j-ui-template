shamefullyHoist: true
strictPeerDependencies: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@jhlc/*"

# pnpm 11 默认拒绝未审查的依赖构建脚本，只允许模板确认需要的构建步骤。
# （2026-10 工具链升级后不再需要 @swc/core：top-level await 由 ES2022
# 原生支持，vite-plugin-top-level-await 已移除。）
allowBuilds:
  "@swc/core": set this to true or false
  esbuild: true
  vue-demi: true

# 安全回溯线与 wl-ui-public / wl-ui-produce 保持一致；同时拉平私有包
# 携带的旧副本。
overrides:
  nanoid: ^3.3.18
  lodash: ^4.18.1
  js-cookie: ^3.0.8
  "@babel/core": 7.29.6
